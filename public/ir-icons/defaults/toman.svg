<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect width="48" height="48" rx="12" fill="#0f766e"/>
  <!-- stacked banknotes -->
  <rect x="10" y="16" width="30" height="18" rx="3" fill="#99f6e4" opacity="0.45"/>
  <rect x="8" y="14" width="32" height="18" rx="3" fill="#ccfbf1"/>
  <!-- inner frame -->
  <rect x="11" y="17" width="26" height="12" rx="1.6" fill="none" stroke="#0f766e" stroke-width="1.2"/>
  <!-- medallion -->
  <circle cx="18" cy="23" r="3.4" fill="none" stroke="#0f766e" stroke-width="1.15"/>
  <circle cx="18" cy="23" r="1.3" fill="#0f766e"/>
  <!-- toman wordmark (Persian) -->
  <text x="31.5" y="25.4" text-anchor="end" font-family="Tahoma, sans-serif" font-size="6.2" font-weight="700" fill="#115e59">تومان</text>
</svg>
