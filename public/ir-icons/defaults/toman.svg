<!--
  تومان — the static twin of components/ui/TomanIcon.tsx. The two must stay
  identical, or the app has two Toman marks depending on which path rendered it.

  The glyph is the product's ORIGINAL Toman curve, unchanged. Only the plate
  (white rx=12, like every other mark) and the stroke weight (1.7 → 3.6, so it
  survives the 20-28px an asset row renders) differ from the first version.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="تومان">
  <rect width="48" height="48" rx="12" fill="#FFFFFF"/>
  <g transform="scale(-1,1) translate(-48,0)">
    <path d="M15 22 C15 27.5 19 29.5 24 29.5 C29 29.5 33 27.5 33 22 C33 21.4 25.8 21 21 21" fill="none" stroke="#0F6B62" stroke-width="3.6" stroke-linecap="round"/>
  </g>
</svg>
